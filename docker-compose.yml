# LogIQ infrastructure: Kafka (KRaft, no ZooKeeper), HDFS, MongoDB, Neo4j.
# Spark, FastAPI and Next.js run on the host so they are easy to debug.

x-hadoop-env: &hadoop-env
  CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
  HDFS-SITE.XML_dfs.namenode.rpc-address: namenode:8020
  HDFS-SITE.XML_dfs.namenode.rpc-bind-host: 0.0.0.0
  HDFS-SITE.XML_dfs.namenode.datanode.registration.ip-hostname-check: "false"
  HDFS-SITE.XML_dfs.replication: "1"
  HDFS-SITE.XML_dfs.permissions.enabled: "false"
  # The datanode advertises "localhost" so Spark on the host can reach it
  # through the published port 9866.
  HDFS-SITE.XML_dfs.datanode.hostname: localhost
  HDFS-SITE.XML_dfs.client.use.datanode.hostname: "true"
  HDFS-SITE.XML_dfs.namenode.name.dir: /data/name
  HDFS-SITE.XML_dfs.datanode.data.dir: /data/dn
  HADOOP_HEAPSIZE_MAX: 512m
  # Log to the console (docker logs) and to rolling files in /var/log/hadoop,
  # which the web UIs list under Utilities > Logs.
  LOG4J.PROPERTIES_log4j.rootLogger: INFO, stdout, RFA
  LOG4J.PROPERTIES_log4j.appender.stdout: org.apache.log4j.ConsoleAppender
  LOG4J.PROPERTIES_log4j.appender.stdout.layout: org.apache.log4j.PatternLayout
  LOG4J.PROPERTIES_log4j.appender.stdout.layout.ConversionPattern: "%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n"
  LOG4J.PROPERTIES_log4j.appender.RFA: org.apache.log4j.RollingFileAppender
  LOG4J.PROPERTIES_log4j.appender.RFA.File: /var/log/hadoop/hadoop.log
  LOG4J.PROPERTIES_log4j.appender.RFA.MaxFileSize: 10MB
  LOG4J.PROPERTIES_log4j.appender.RFA.MaxBackupIndex: "3"
  LOG4J.PROPERTIES_log4j.appender.RFA.layout: org.apache.log4j.PatternLayout
  LOG4J.PROPERTIES_log4j.appender.RFA.layout.ConversionPattern: "%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n"

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: logiq-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    volumes:
      - kafka-data:/var/lib/kafka/data

  namenode:
    image: apache/hadoop:3.4.1
    container_name: logiq-namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    user: root
    ports:
      - "8020:8020"
      - "9870:9870"
    environment:
      <<: *hadoop-env
      # Formats the namenode on first start (when /data/name does not exist yet).
      ENSURE_NAMENODE_DIR: /data/name
    volumes:
      - hdfs-name:/data

  datanode:
    image: apache/hadoop:3.4.1
    container_name: logiq-datanode
    command: ["hdfs", "datanode"]
    user: root
    depends_on:
      - namenode
    ports:
      - "9864:9864"
      - "9866:9866"
    environment:
      <<: *hadoop-env
    volumes:
      - hdfs-data:/data

  mongo:
    image: mongo:7
    container_name: logiq-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  neo4j:
    image: neo4j:5-community
    container_name: logiq-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/logiq-password
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data

volumes:
  kafka-data:
  hdfs-name:
  hdfs-data:
  mongo-data:
  neo4j-data:
